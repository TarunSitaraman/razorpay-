[project]
name = "yukti"
version = "0.1.0"
description = "Yukti — the recovery agent that knows when to stop. Razorpay Buildathon Track 3."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.1",
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "httpx>=0.27",
    "structlog>=24.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.14",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.9",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.40b0",
    "mcp>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["control", "datagen", "sandbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["control", "datagen", "sandbox"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires the local stack (make up)",
    "slow: refits a model; seconds rather than milliseconds",
]
